<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOS-04 Tiles Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .panel { position: absolute; z-index: 1000; top: 10px; right: 10px; background: #fffe; padding: 8px 12px;
           font: 13px system-ui, sans-serif; border-radius: 6px; max-width: 300px; }
  .panel code { font-size: 11px; word-break: break-all; display: block; margin-top: 6px; }
  #value { margin-top: 6px; font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <b>ISRO EOS-04 via OGC WMTS</b><br>
  <small>Nagarjuna Sagar, Aug-Sep 2026 (Bhoonidhi EOS-04 SAR MRS: backscatter mosaic + water spread). Click the map for pixel values (WMTS GetFeatureInfo).</small><br>
  Server: <input id="base" size="26"><button onclick="load()">Load</button>
  <div id="value"></div>
  <code id="url"></code>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const LAYERS = {
    'Backscatter HH (dB), cycle 95 (7-23 Aug)': 'bhoonidhi:bs_hh_c95',
    'Backscatter HH (dB), cycle 96 (24 Aug-9 Sep)': 'bhoonidhi:bs_hh_c96',
    'Backscatter HH (dB), cycle 97 (10-26 Sep)': 'bhoonidhi:bs_hh_c97',
    'Backscatter HV (dB), cycle 97': 'bhoonidhi:bs_hv_c97',
    'Water spread, cycle 95': 'bhoonidhi:ws_c95',
    'Water spread, cycle 96': 'bhoonidhi:ws_c96',
    'Water spread, cycle 97': 'bhoonidhi:ws_c97',
    'Water change, cycle 95 to 97': 'bhoonidhi:wschange_c95_c97',
  };
  const MEANING = {   // EOS-04 coding / derived change classes
    'bhoonidhi:wschange_c95_c97': { 0: 'no water', 1: 'stable water', 2: 'water gained', 3: 'water lost' },
    default: { 0: 'land / no water', 2: 'water' },
  };
  const map = L.map('map').setView([16.6, 79.2], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
              { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
  let overlays = {}, control, active = null, base = '';

  // default: same origin as this page when served by the gateway, else local GeoServer
  document.getElementById('base').value =
    location.protocol.startsWith('http') && location.port !== '' && location.port !== '8080'
      ? location.origin + '/geoserver' : 'http://localhost:8080/geoserver';

  const wmtsUrl = (b, layer) =>   // RESTful WMTS served by GeoWebCache; Web Mercator (EPSG:3857-equivalent)
    `${b}/gwc/service/wmts/rest/${layer}/EPSG:900913/EPSG:900913:{z}/{y}/{x}?format=image/png`;

  function load() {
    base = document.getElementById('base').value.replace(/\/$/, '');
    Object.values(overlays).forEach(l => map.hasLayer(l) && map.removeLayer(l));
    if (control) map.removeControl(control);
    overlays = {};
    for (const [title, layer] of Object.entries(LAYERS)) {
      overlays[title] = L.tileLayer(wmtsUrl(base, layer), { maxZoom: 18, opacity: 0.9 });
      overlays[title]._layerName = layer;
    }
    active = overlays['Water change, cycle 95 to 97'];
    active.addTo(map);
    control = L.control.layers(overlays, null, { collapsed: false }).addTo(map);
    map.on('baselayerchange', e => { active = e.layer; });
    document.getElementById('url').textContent = wmtsUrl(base, 'bhoonidhi:ws_c97');
  }

  // WMTS GetFeatureInfo on click
  map.on('click', async e => {
    if (!active) return;
    const z = Math.min(map.getZoom(), 18), n = 2 ** z;
    const p = map.project(e.latlng, z);               // pixel coords at zoom z (256px tiles)
    const col = Math.floor(p.x / 256), row = Math.floor(p.y / 256);
    const i = Math.floor(p.x - col * 256), j = Math.floor(p.y - row * 256);
    const q = new URLSearchParams({
      service: 'WMTS', request: 'GetFeatureInfo', version: '1.0.0', layer: active._layerName, style: '',
      format: 'image/png', infoformat: 'application/json', tilematrixset: 'EPSG:900913',
      tilematrix: `EPSG:900913:${z}`, tilerow: row, tilecol: col, i, j });
    const out = document.getElementById('value');
    try {
      const r = await fetch(`${base}/gwc/service/wmts?${q}`);
      const f = (await r.json()).features[0];
      const v = f ? Number(f.properties.GRAY_INDEX) : null;
      const m = MEANING[active._layerName] || MEANING.default;
      out.textContent = v === null ? 'No data here'
        : active._layerName.includes(':bs_') ? `${v.toFixed(1)} dB`
        : `Value ${v}${m[v] ? ' = ' + m[v] : ''}`;
    } catch (err) { out.textContent = 'GetFeatureInfo failed'; }
  });
  load();
</script>
</body>
</html>
