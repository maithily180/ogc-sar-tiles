# Read-only public gateway: exposes only the OGC tile/map endpoints and the demo page.
# GeoServer's admin UI, REST API and GWC REST API are never reachable through this port.
server {
    listen 80;
    server_name _;

    location = / { return 302 /demo/; }
    location /demo/ { alias /usr/share/nginx/html/; index index.html; }

    location ~ ^/geoserver/(gwc/service/wmts|ogc/tiles/|bhoonidhi/wms|wms$) {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://geoserver:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        add_header Access-Control-Allow-Origin * always;
    }

    location / { return 403; }
}
