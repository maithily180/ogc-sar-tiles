services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.x
    container_name: bhoonidhi-geoserver
    ports:
      - "8080:8080"
    environment:
      INSTALL_EXTENSIONS: "true"
      SKIP_DEMO_DATA: "true"
      # OGC API - Tiles is a GeoServer community module (nightly builds only)
      COMMUNITY_EXTENSIONS: "ogcapi-features,ogcapi-tiles"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx2g"
    volumes:
      - ./data/cogs:/opt/geoserver_data/data/cogs:ro
      - geoserver_data:/opt/geoserver_data
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: bhoonidhi-gateway
    depends_on: [geoserver]
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  geoserver_data:
